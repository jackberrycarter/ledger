<style>

  text-transform:uppercase;letter-spacing:.04em}

<script>
(function(){
const ROOT=document.getElementById('root');
const $=s=>ROOT.querySelector(s);
const KEY='ledger_v3';

/* Storage picks itself: a ledger server if one answers, otherwise
   this browser. Server mode is what makes the data a real file you can back up. */
const API='./api/data', PING='./api/ping';
const store={
  ok:true, mode:'local',
  async test(){
    try{ if(location.protocol==='file:') throw 0;
      const c=new AbortController(); const t=setTimeout(()=>c.abort(),2500);
      const r=await fetch(PING,{signal:c.signal,cache:'no-store'}); clearTimeout(t);
      if(r.ok){const j=await r.json(); if(j&&j.ledger){this.mode='server';this.ok=true;return true;}}
    }catch(e){}
    this.mode='local';
    const probe=KEY+'_probe';
    try{if(window.storage){await window.storage.set(probe,'1');
      const r=await window.storage.get(probe); if(r&&r.value==='1'){this.ok=true;return true;}}}catch(e){}
    try{localStorage.setItem(probe,'1');
      const v=localStorage.getItem(probe); localStorage.removeItem(probe);
      this.ok=(v==='1'); return this.ok;}catch(e){this.ok=false;return false;}
  },
  async get(){
    if(this.mode==='server'){
      try{const r=await fetch(API,{cache:'no-store'});
        if(r.ok){const j=await r.json(); return (j&&j.accounts)?j:null;}}catch(e){this.ok=false;}
      return null;
    }
    try{if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null;}}catch(e){}
    try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){return null;}
  },
  async set(o){
    const s=JSON.stringify(o);
    if(this.mode==='server'){
      try{const r=await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:s});
        this.ok=r.ok;}catch(e){this.ok=false;}
      return;
    }
    try{if(window.storage){await window.storage.set(KEY,s);this.ok=true;return;}}catch(e){}
    try{localStorage.setItem(KEY,s);this.ok=true;}catch(e){this.ok=false;}
  }
};

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const fmtD=s=>{const d=parse(s);return `${pad(d.getMonth()+1)}/${pad(d.getDate())}/${String(d.getFullYear()).slice(2)}`;};
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
/* Lets you type "750-350" or "12*3.50" into an amount field. Restricted to
   digits, + - * / ( ) . and whitespace before ever touching Function() -
   that character set can't do anything but arithmetic, no way to inject
   real code through it. */
function safeMathEval(str){
  const s=String(str).trim();
  if(!s || !/^[0-9+\-*/(). \s]+$/.test(s)) return null;
  try{
    const val=Function('"use strict"; return ('+s+')')();
    return (typeof val==='number' && isFinite(val)) ? val : null;
  }catch(e){ return null; }
}
const plain=n=>n?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
/* Called fresh everywhere it's used, not cached at load - the ledger tab
   can sit open across midnight, and a frozen "today" silently misdates
   whatever assumes it (recon default, new-txn date, the calendar dot). */
const TODAY=()=>iso(new Date());
const yearOut=(()=>{const d=new Date();d.setFullYear(d.getFullYear()+1);return iso(d);})();
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
let uid=Date.now(), seq=0;
const nid=()=>'x'+(++uid).toString(36);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS=['Income','Transfer','Monthly Bills: Rent/Mortgage','Monthly Bills: Electricity',
 'Monthly Bills: Natural Gas/Propane/Oil','Monthly Bills: Water','Monthly Bills: Internet',
 'Monthly Bills: Cable TV','Monthly Bills: Phone','Monthly Bills: Car Payment',
 'Monthly Bills: Subscriptions','Monthly Bills: Homelab','Monthly Bills: Debt Payments',
 'Everyday Expenses: Groceries/Gas','Everyday Expenses: Household','Everyday Expenses: Spending Money',
 'Everyday Expenses: Allowance','Everyday Expenses: Video Games/PlayStation',
 'Rainy Day Funds: Car Insurance','Rainy Day Funds: Car Repairs','Rainy Day Funds: Medical',
 'Savings Goals','Savings Goals: Emergency Fund','Uncategorized'];

/* Payee -> category guesses, applied live while typing a payee (only when the
   row's category is still the untouched default, so it never overwrites a
   category you picked on purpose). Add more [regex, category] pairs here as
   patterns come up. */
const PAYEE_CAT_RULES=[
  [/walmart/i,'Everyday Expenses: Groceries/Gas'],
];
const autoCatFor=payee=>{
  const hit=PAYEE_CAT_RULES.find(([re])=>re.test(payee));
  return hit?hit[1]:null;
};
/* Category last used for this exact payee (newest row wins), so a repeat
   payee fills its usual category. Falls back to PAYEE_CAT_RULES. Pass dir
   ('in'/'out') to only learn from rows going the same way, so a Walmart
   paycheck deposit never teaches a Walmart purchase to be Income. */
const histCatFor=(payee,skipId,dir)=>{
  const k=payee.trim().toLowerCase(); if(!k) return null;
  let best=null;
  S.txns.forEach(x=>{
    if(x.id===skipId||!x.cat||x.cat==='Uncategorized'||(x.payee||'').trim().toLowerCase()!==k) return;
    if(dir&&((+x.inflow||0)>0?'in':'out')!==dir) return;
    if(!best||x.date>best.date||(x.date===best.date&&(x.ord||0)>(best.ord||0))) best=x;
  });
  return best?best.cat:(dir==='in'?null:autoCatFor(payee));
};
/* Payee suggestions: prefix matches before substring matches, then the
   most-used payees first. */
const payeeSuggest=(q,skipId)=>{
  const cnt=new Map();
  S.txns.forEach(x=>{ const p=(x.payee||'').trim(); if(p&&x.id!==skipId) cnt.set(p,(cnt.get(p)||0)+1); });
  const k=q.trim().toLowerCase(); if(!k) return [];
  return [...cnt.keys()].filter(p=>p.toLowerCase().includes(k))
    .sort((a,b)=>(b.toLowerCase().startsWith(k)-a.toLowerCase().startsWith(k))||(cnt.get(b)-cnt.get(a))||a.localeCompare(b))
    .slice(0,12);
};
const catSuggest=q=>{
  const k=q.trim().toLowerCase(); if(!k) return CATS.slice();
  return CATS.filter(c=>c.toLowerCase().includes(k))
    .sort((a,b)=>(b.toLowerCase().startsWith(k)-a.toLowerCase().startsWith(k))||
      ((b.split(': ')[1]||'').toLowerCase().startsWith(k)-(a.split(': ')[1]||'').toLowerCase().startsWith(k)));
};

const blankRule=()=>({id:nid(),payee:'',cat:'Uncategorized',acct:'a1',toAcct:'',amt:0,dir:'out',
  freq:'monthly',day:1,wd:4,anchor:TODAY(),start:TODAY()});
/* A rule is a linked transfer (both sides generated together, always
   category Transfer) only when toAcct is a real, different, still-existing
   account. That guard - not r.cat==='Transfer' - is what decides it, so
   pre-existing single-sided rules that already used the Transfer category
   (e.g. a credit card payment entered on one account only) keep working exactly as before;
   they have no toAcct and are untouched by any of this. */
const isXferRule=r=>!!(r&&r.toAcct&&r.toAcct!==r.acct&&S.accounts.some(a=>a.id===r.toAcct));

const fresh=()=>({
  accounts:[{id:'a1',name:'Checking 1',opening:0,reconciledThrough:null},
            {id:'a2',name:'Checking 2',opening:0,reconciledThrough:null}],
  rules:[blankRule()], txns:[], horizon:yearOut, fs:14, filter:'a1', showRules:false, dark:false,
  showReconciled:false, showChart:false, chartMode:'cat', chartMonth:null,
  skips:{}   // ruleId -> [cycle,...] rows you deleted on purpose; Generate must never recreate these
});
let S=fresh(), selId=null;

/* One-step undo. Every mutating action snapshots S first; Undo swaps the
   live state with that snapshot, so pressing it again redoes. A fresh
   snapshot on the next edit clears the redo side, same as any normal
   undo. Deliberately single-level — simple to reason about, matches
   "just back up my last step." */
let undoSnap=null;
function beforeChange(){ undoSnap=JSON.stringify(S); }
function undo(){
  if(!undoSnap) return;
  const cur=JSON.stringify(S);
  S=JSON.parse(undoSnap);
  undoSnap=cur;
  seq=S.txns.reduce((m,x)=>Math.max(m,x.ord||0),0)+1;
  selId=null; calFor=null; calView=null; recoOpen=false; manualRecoOpen=false; xferOpen=false; acctOpen=false;
  save(); render();
}

/* ---- recurrence ---- */
function dates(r){
  const floor=parse(TODAY());
  const wanted=r.start?parse(r.start):floor;
  const start=wanted>floor?wanted:floor;   // never generate before today, regardless
  const end=parse(S.horizon), out=[];
  if(end<start) return out;
  if(r.freq==='weekdays'){
    const d=new Date(start);
    while(d<=end){ const w=d.getDay(); if(w>=1&&w<=5) out.push(iso(d)); d.setDate(d.getDate()+1); }
  }else if(r.freq==='weekly'||r.freq==='biweekly'){
    let d;
    if(r.freq==='biweekly'&&r.anchor){
      d=parse(r.anchor);
      while(d>start) d.setDate(d.getDate()-14);
      while(d<start) d.setDate(d.getDate()+14);
    }else{
      d=new Date(start);
      while(d.getDay()!==Number(r.wd)) d.setDate(d.getDate()+1);
    }
    const step=r.freq==='weekly'?7:14;
    while(d<=end){ out.push(iso(d)); d.setDate(d.getDate()+step); }
  }else{
    let y=start.getFullYear(), m=start.getMonth();
    while(true){
      const last=new Date(y,m+1,0).getDate();
      const day=r.freq==='lastday'?last:Math.min(Number(r.day)||1,last);
      const dd=new Date(y,m,day);
      if(dd>end) break;
      if(dd>=start) out.push(iso(dd));
      m++; if(m===12){m=0;y++;}
    }
  }
  return out;
}
/* One generated row for a rule/cycle/account. Transfer rules always post as
   category Transfer regardless of whatever r.cat happens to hold; ordinary
   rules use r.cat/r.dir as always. xferId (only set for transfer rows) is
   the pairing key used to delete both sides together and to keep amount
   edits balanced - see the [data-del] handler and edit()'s outflow/inflow
   branch below. */
function makeRow(r,d,acct,outflow,inflow,xferId){
  const row={id:nid(),ruleId:r.id,cycle:d,ord:seq++,date:d,acct,payee:r.payee,
    cat:isXferRule(r)?'Transfer':r.cat,memo:r.memo||'',outflow,inflow,cleared:false};
  if(xferId) row.xferId=xferId;
  return row;
}
function rowsForCycle(r,d){
  if(isXferRule(r)){
    const xf=nid();
    return [makeRow(r,d,r.acct,+r.amt,0,xf), makeRow(r,d,r.toAcct,0,+r.amt,xf)];
  }
  return [makeRow(r,d,r.acct, r.dir==='out'?+r.amt:0, r.dir==='in'?+r.amt:0)];
}
/* cycle -> Set(account ids already represented) among the rows a regen pass
   is keeping for this one rule. A plain rule only ever needs r.acct covered;
   a transfer rule needs both r.acct and r.toAcct covered independently, so
   editing (and thus preserving) just one leg's amount doesn't make Generate
   think the whole cycle is done and leave the other leg missing forever. */
function coveredAccts(rid,rows){
  const m={};
  rows.filter(t=>t.ruleId===rid).forEach(t=>{
    const cyc=t.cycle||t.date;
    (m[cyc]=m[cyc]||new Set()).add(t.acct);
  });
  return m;
}
/* Generates whatever rows are still missing for one rule, given the rows
   already being kept for it. Shared by regen/regenOne/addNext so the
   "which side, if any, still needs making" logic only lives in one place. */
function missingRowsForRule(r,keepForRule,onlyFirst){
  if(!r.payee&&!r.amt) return [];
  const skip=new Set(S.skips[r.id]||[]);
  const covered=coveredAccts(r.id,keepForRule);
  const accts=isXferRule(r)?[r.acct,r.toAcct]:[r.acct];
  const made=[];
  for(const d of dates(r)){
    if(skip.has(d)) continue;
    const have=covered[d]||new Set();
    const missing=accts.filter(a=>!have.has(a));
    if(!missing.length) continue;
    if(missing.length===accts.length){
      made.push(...rowsForCycle(r,d));
    }else{
      // exactly one leg of a transfer survived (e.g. its amount was hand-
      // edited); recreate only the missing leg, not a fresh pair.
      const a=missing[0];
      made.push(makeRow(r,d,a, a===r.acct?+r.amt:0, a===r.toAcct?+r.amt:0, nid()));
    }
    if(onlyFirst) break;
  }
  return made;
}
/* Rebuild generated rows. Rows you edited by hand are kept, and their date is
   not regenerated, so a corrected amount survives every future Generate. */
function regen(){
  const keep=S.txns.filter(t=>!t.ruleId||t.edited);
  const made=[];
  for(const r of S.rules) made.push(...missingRowsForRule(r,keep,false));
  const keptRuleRows=keep.filter(t=>t.ruleId).length;
  S.txns=keep.concat(made);
  save();
  return {added:made.length, kept:keptRuleRows};
}
/* Generates future rows for exactly one rule. Every row belonging to any
   OTHER rule - edited or not - is filtered into "keep" untouched, never
   even re-examined. This is the scoped, low-risk version: adding one
   forgotten bill and generating just it can't disturb months of
   carefully-nudged dates elsewhere. */
function regenOne(rid){
  const r=S.rules.find(x=>x.id===rid);
  if(!r) return {added:0, kept:0};
  const keep=S.txns.filter(t=>t.ruleId!==rid || t.edited);
  const keepForRule=keep.filter(t=>t.ruleId===rid);
  const made=missingRowsForRule(r,keepForRule,false);
  const keptRuleRows=keepForRule.length;
  S.txns=keep.concat(made);
  save();
  return {added:made.length, kept:keptRuleRows};
}
/* Adds exactly the single next not-yet-created occurrence of one rule -
   the YNAB-style "Add next, click again for the one after that" flow.
   Sits alongside Generate/Generate this rather than replacing either;
   uses the same held-cycles logic as regenOne so it can never
   double-add a date that's already on the ledger or was deliberately
   deleted (S.skips). Never touches any row but the one it creates
   (both sides of it, for a transfer rule). */
function addNext(rid){
  const r=S.rules.find(x=>x.id===rid);
  if(!r||(!r.payee&&!r.amt)) return {added:0,date:null};
  const keepForRule=S.txns.filter(t=>t.ruleId===rid);
  const made=missingRowsForRule(r,keepForRule,true);
  if(!made.length) return {added:0,date:null};
  S.txns.push(...made);
  save();
  return {added:made.length,date:made[0].date};
}
function computed(){
  /* Same date: income posts before outflow, every time, so a same-day
     paycheck-then-autopay pair never shows a false low point. */
  const list=[...S.txns].sort((a,b)=>{
    if(a.date!==b.date) return a.date<b.date?-1:1;
    const ai=(+a.inflow||0)>0, bi=(+b.inflow||0)>0;
    if(ai!==bi) return ai?-1:1;
    return a.ord-b.ord;
  });
  const bal={}; S.accounts.forEach(a=>bal[a.id]=+a.opening||0);
  return list.map(t=>{
    bal[t.acct]=(bal[t.acct]||0)+(+t.inflow||0)-(+t.outflow||0);
    return {...t,balance:bal[t.acct]};
  });
}
const acctNm=id=>(S.accounts.find(a=>a.id===id)||{}).name||'?';
/* Running-balance color tiers: negative first, then three escalating
   thresholds, so a tight stretch is visible while scrolling without any
   text callouts. */
function balClass(bal){
  if(bal<0) return 'neg';
  if(bal<100) return 'crit';
  if(bal<500) return 'low';
  if(bal<1000) return 'watch';
  return '';
}

/* Flags rows that look like accidental duplicates, not just "same payee
   twice this month" — that would light up on every weekly paycheck and
   grocery run. Two checks instead:
   1) Two occurrences of the SAME recurring rule landing closer together
      than half that rule's own normal spacing (the exact shape of the
      old drag-then-Generate ghost-duplicate bug, whatever the rule's
      frequency is).
   2) Two rows, same account/payee/exact amount, within a few days of
      each other, regardless of rule — plain accidental double-entry. */
function computeDupSet(rows){
  const dup=new Set();
  const EXPECT={weekly:7,biweekly:14,monthly:27,lastday:27,weekdays:1};
  const byRule={};
  rows.forEach(r=>{ if(r.ruleId) (byRule[r.ruleId]=byRule[r.ruleId]||[]).push(r); });
  Object.entries(byRule).forEach(([rid,list])=>{
    const rule=S.rules.find(x=>x.id===rid);
    const base=rule?(EXPECT[rule.freq]||14):6;
    const thresh=Math.max(2,base/2);
    list.sort((a,b)=>a.date<b.date?-1:1);
    for(let i=1;i<list.length;i++){
      const gap=(parse(list[i].date)-parse(list[i-1].date))/864e5;
      if(gap<thresh){ dup.add(list[i].id); dup.add(list[i-1].id); }
    }
  });
  const byKey={};
  rows.forEach(r=>{
    if(!r.payee) return;
    const amt=(+r.inflow||0)-(+r.outflow||0);
    if(!amt) return;
    const k=r.acct+'|'+r.payee.trim().toLowerCase()+'|'+amt;
    (byKey[k]=byKey[k]||[]).push(r);
  });
  Object.values(byKey).forEach(list=>{
    if(list.length<2) return;
    list.sort((a,b)=>a.date<b.date?-1:1);
    for(let i=1;i<list.length;i++){
      const gap=(parse(list[i].date)-parse(list[i-1].date))/864e5;
      if(gap<3){ dup.add(list[i].id); dup.add(list[i-1].id); }
    }
  });
  return dup;
}

/* Every account tab shows its checked-box balance, so the current amount is
   visible without switching to it. Cleared rows only - future generated

function clearedBalOf(a){
  return (+a.opening||0)+S.txns.filter(t=>t.acct===a.id&&t.cleared)
    .reduce((s,t)=>s+(+t.inflow||0)-(+t.outflow||0),0);
}

const CHART_COLORS=['#4fa3d9','#e07b53','#5fb87a','#c78bd6','#d9b23f','#e0607a',

function chartMonths(){
  const acct=S.filter;
  const scope=acct==='all'?S.txns:S.txns.filter(t=>t.acct===acct);
  const set=new Set(scope.filter(t=>t.outflow>0).map(t=>t.date.slice(0,7)));
  return [...set].sort();
}
function chartData(month,mode){
  const acct=S.filter;
  const scope=(acct==='all'?S.txns:S.txns.filter(t=>t.acct===acct))
    .filter(t=>t.outflow>0 && t.date.slice(0,7)===month);
  const sums={};
  scope.forEach(t=>{
    const key=mode==='payee'?(t.payee||'(no payee)').trim():(t.cat||'Uncategorized');
    sums[key]=(sums[key]||0)+(+t.outflow||0);
  });
  let entries=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((s,[,v])=>s+v,0);
  if(entries.length>8){
    const top=entries.slice(0,8);
    const rest=entries.slice(8).reduce((s,[,v])=>s+v,0);
    entries=rest>0?[...top,['Other',rest]]:top;
  }
  return {entries,total};
}
function pieSVG(entries,total){
  if(!total) return `<div style="padding:20px;color:var(--dim);font-size:calc(var(--fs) - 1px)">
    No spending in this month yet.</div>`;
  const cx=90,cy=90,r=80;
  let angle=-90, paths='';
  entries.forEach(([label,val],i)=>{
    const frac=val/total, sweep=frac*360;
    const x1=cx+r*Math.cos(angle*Math.PI/180), y1=cy+r*Math.sin(angle*Math.PI/180);
    const end=angle+sweep;
    const x2=cx+r*Math.cos(end*Math.PI/180), y2=cy+r*Math.sin(end*Math.PI/180);
    const large=sweep>180?1:0;
    const color=CHART_COLORS[i%CHART_COLORS.length];
    if(entries.length===1){
      paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
    } else {
      paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color}" stroke="var(--drawer)" stroke-width="1.5"/>`;
    }
    angle=end;
  });
  return `<svg viewBox="0 0 180 180" width="180" height="180">${paths}</svg>`;
}

/* ---------- Budget (YNAB4-style envelopes) ----------
   One budgeted account (S.budget.acct). Every category except Income,
   Transfer and Uncategorized is an envelope. Each month:
     Available = last month's Available (if positive - overspending resets
                 to 0, YNAB4 style) + Assigned + Activity
   Ready to Assign is never stored. It is always derived from the real
   account balance:
     balance - sum(Available this month) - sum(Assigned in future months)
   so uncategorized spending, adjustments and last month's overspending all
   come out of it on their own, and it can never drift from the bank.
   "Real" rows = dated today or earlier, and either cleared or typed by hand.
   An unchecked recurring projection doesn't count until it posts, so money
   that hasn't arrived can't be budgeted. */
const ENV_SKIP=new Set(['Income','Transfer','Uncategorized']);
const ym=s=>s.slice(0,7);
const ymAdd=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const ymLabel=m=>{const[y,mo]=m.split('-');return `${['January','February','March','April','May','June','July','August','September','October','November','December'][+mo-1]} ${y}`;};
function ensureBudget(){
  if(!S.budget){
    /* Linked transfers out of the budgeted account land in an envelope by
       destination account, seeded once by name; ones with no mapping just
       come out of Ready to Assign. */
    const xferEnv={};
    S.accounts.forEach(a=>{
      if(/emergency/i.test(a.name)) xferEnv[a.id]='Savings Goals: Emergency Fund';
      else if(/allowance/i.test(a.name)) xferEnv[a.id]='Everyday Expenses: Allowance';
    });
    S.budget={acct:'a1',start:ym(TODAY()),assigned:{},cats:[],xferEnv};
  }
  return S.budget;
}
/* Categories added from the budget panel: add-only, slotted in before Uncategorized. */
function mergeBudgetCats(){
  ((S.budget&&S.budget.cats)||[]).forEach(c=>{ if(!CATS.includes(c)) CATS.splice(CATS.indexOf('Uncategorized'),0,c); });
}
const envCats=()=>CATS.filter(c=>!ENV_SKIP.has(c));
const isRealRow=t=>t.date<=TODAY()&&(t.cleared||!t.ruleId);
/* Which envelope a row in the budgeted account belongs to, or null. */
function envOf(t,xferSib){
  const B=S.budget;
  if(t.acct!==B.acct) return null;
  if(t.xferId){ const sib=xferSib.get(t.xferId+'|'+t.id); return sib?(B.xferEnv[sib]||null):null; }
  return ENV_SKIP.has(t.cat)?null:(CATS.includes(t.cat)?t.cat:null);
}
function budgetCalc(view){
  const B=ensureBudget(), today=TODAY();
  const curM=ym(today)<B.start?B.start:ym(today);
  const xferSib=new Map();
  S.txns.forEach(t=>{ if(t.xferId) S.txns.forEach(x=>{ if(x.xferId===t.xferId&&x.id!==t.id) xferSib.set(t.xferId+'|'+t.id,x.acct); }); });
  const act={};   // month -> cat -> net (inflow - outflow), real rows only
  let bal=+((S.accounts.find(a=>a.id===B.acct)||{}).opening)||0;
  S.txns.forEach(t=>{
    if(t.acct!==B.acct||!isRealRow(t)) return;
    const net=(+t.inflow||0)-(+t.outflow||0);
    bal+=net;
    const m=ym(t.date); if(m<B.start) return;
    const c=envOf(t,xferSib); if(!c) return;
    (act[m]=act[m]||{})[c]=((act[m]||{})[c]||0)+net;
  });
  const cats=envCats(), last=view>curM?view:curM;
  const avail={};  // month -> cat -> available
  const asg=(m,c)=>+((B.assigned[m]||{})[c])||0;
  cats.forEach(c=>{
    let a=0;
    for(let m=B.start;m<=last;m=ymAdd(m,1)){
      a=(m===B.start?0:Math.max(0,a))+asg(m,c)+(((act[m]||{})[c])||0);
      (avail[m]=avail[m]||{})[c]=a;
    }
  });
  let future=0;
  Object.keys(B.assigned).forEach(m=>{ if(m>curM) cats.forEach(c=>future+=asg(m,c)); });
  const curAvail=cats.reduce((s,c)=>s+((avail[curM]||{})[c]||0),0);
  const rta=Math.round((bal-curAvail-future)*100)/100;
  /* Planning line for the viewed month: income that's arrived plus income
     the recurring rules still expect (projections dated after today). */
  let expIncome=0, uncat=0, uncatN=0;
  S.txns.forEach(t=>{
    if(t.acct!==B.acct||ym(t.date)!==view) return;
    const real=isRealRow(t), proj=t.ruleId&&!t.cleared&&t.date>today;
    if(t.cat==='Income'&&(real||proj)) expIncome+=(+t.inflow||0)-(+t.outflow||0);
    if(t.cat==='Uncategorized'&&real&&!t.xferId){ uncat+=(+t.outflow||0)-(+t.inflow||0); uncatN++; }
  });
  const assignedView=cats.reduce((s,c)=>s+asg(view,c),0);
  return {cats,act,avail,asg,rta,curM,expIncome,assignedView,uncat,uncatN,xferSib};
}
/* What the recurring rules charge each envelope in month m (projections
   and posted rule rows alike), for "Fill from bills". */
function billsFor(m,xferSib){
  const out={};
  S.txns.forEach(t=>{
    if(!t.ruleId||ym(t.date)!==m) return;
    const c=envOf(t,xferSib); if(!c) return;
    out[c]=(out[c]||0)+(+t.outflow||0)-(+t.inflow||0);
  });
  return out;
}

  return `<div class="panel budget">

  </div>
  </div>`;
}
const parseAmt=s=>{ const n=parseFloat(String(s).replace(/[$,\s]/g,'')); return isFinite(n)?Math.round(n*100)/100:0; };
/* Typing an amount only patches the numbers in place - no redraw - so Tab
   keeps moving straight down the Assigned column. */
function refreshBudgetNumbers(){
  const v=budgetView, R=budgetCalc(v);
  const rt=$('#bRta'); if(rt){ rt.textContent=money(R.rta); rt.parentNode.classList.toggle('neg',R.rta<0); }
  ROOT.querySelectorAll('[data-bav]').forEach(td=>{
    const a=(R.avail[v]||{})[td.dataset.bav]||0;
    td.innerHTML=`<span class="num ${a<0?'neg':''}">${money(a)}</span>`;
  });
  const left=R.expIncome-R.assignedView, p=$('#bPlan');
  if(p) p.innerHTML=`Expected income ${money(R.expIncome)} &middot; assigned ${money(R.assignedView)}
    &middot; <b class="${left<0?'neg':''}">${money(left)}</b> not planned yet this month`;
}
function setAssigned(m,c,amt){
  const B=ensureBudget();
  const mo=B.assigned[m]=B.assigned[m]||{};
  if(amt) mo[c]=amt; else delete mo[c];
  if(!Object.keys(mo).length) delete B.assigned[m];
}
function wireBudgetPanel(){
  const B=ensureBudget(), v=budgetView;
  const go=n=>{ budgetView=ymAdd(budgetView,n); if(budgetView<B.start) budgetView=B.start; deferPanel(); };

    inp.onchange=()=>{
      beforeChange(); const amt=parseAmt(inp.value);

    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault();

  });

    beforeChange(); let n=0;

      amt=Math.round(amt*100)/100;
      if(amt>0&&!((B.assigned[v]||{})[c])){ setAssigned(v,c,amt); n++; }
    });
    save(); deferPanel();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ const m=$('#bMsg'); if(m) m.textContent=n?`Filled ${n} envelope${n===1?'':'s'}.`:'Nothing to fill - every envelope it would touch already has an amount.'; }));
  };
  $('#bFill').onclick=()=>fillZeros(billsFor(v,budgetCalc(v).xferSib));
  $('#bCopy').onclick=()=>fillZeros(Object.assign({},B.assigned[ymAdd(v,-1)]||{}));
  if($('#bUncat')) $('#bUncat').onclick=()=>{ catQ={cat:'Uncategorized',month:v}; S.filter=B.acct; save(); render(); };
  const add=()=>{
    const el=$('#bNewCat'), raw=el.value.trim().replace(/\s*:\s*/,': '), msg=$('#bMsg');
    if(!raw){ msg.textContent='Type a name first.'; return; }
    if(CATS.some(c=>c.toLowerCase()===raw.toLowerCase())){ msg.textContent='That category already exists.'; return; }
    beforeChange(); B.cats.push(raw); mergeBudgetCats(); save(); deferPanel();
  };
  $('#bAddCat').onclick=add;
  $('#bNewCat').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } };
}

/* ---- editing ---- */
function edit(td,id,f){
  const t=S.txns.find(x=>x.id===id); if(!t) return;
  let el;
  if(f==='date'){el=document.createElement('input');el.type='date';el.value=t.date;}
  else if(f==='acct'){
    el=document.createElement('select');
    S.accounts.map(a=>[a.id,a.name]).forEach(([v,l])=>{
      const o=document.createElement('option');o.value=v;o.textContent=l;
      if(t[f]===v)o.selected=true;el.appendChild(o);});
  }else{el=document.createElement('input');el.type='text';el.value=t[f]||'';}
  /* Payee and Category get a custom-drawn suggestion list instead of a
     native datalist/select (native popup clicks are unreliable on some KDE/Wayland setups, and a
     datalist's highlighted entry isn't taken on Tab). The top match is
     highlighted; Tab/Enter takes it, arrows move, a click picks one. */
  let ac=null, acItems=[], acIdx=-1;
  const acClose=()=>{ if(ac){ac.remove();ac=null;} acItems=[]; acIdx=-1; };
  const acDraw=()=>{
    if(!acItems.length){ if(ac){ac.remove();ac=null;} return; }
    if(!ac){ ac=document.createElement('div'); ac.className='ac'; ROOT.appendChild(ac);
      ac.addEventListener('mousedown',e=>{
        e.preventDefault();
        const d=e.target.closest('[data-i]'); if(!d) return;
        el.value=acItems[+d.dataset.i]; acClose(); el.blur();
      }); }
    const b=el.getBoundingClientRect();
    ac.style.left=b.left+'px'; ac.style.top=(b.bottom+2)+'px'; ac.style.minWidth=Math.max(220,b.width)+'px';
    ac.innerHTML=acItems.map((v,i)=>`<div data-i="${i}" class="${i===acIdx?'on':''}">${esc(v)}</div>`).join('');
    const on=ac.querySelector('.on'); if(on) on.scrollIntoView({block:'nearest'});
  };
  const acRefresh=initial=>{
    if(f==='payee'){ acItems=payeeSuggest(el.value,id); acIdx=acItems.length?0:-1; }
    else { acItems=catSuggest(initial?'':el.value);
      acIdx=initial?acItems.indexOf(t.cat):(acItems.length?0:-1); }
    acDraw();
  };
  const acScroll=()=>{ if(ac) acDraw(); };
  if(f==='payee'||f==='cat'){
    el.setAttribute('autocomplete','off');
    el.addEventListener('input',()=>acRefresh(false));
    ROOT.addEventListener('scroll',acScroll,true);
    el.addEventListener('blur',()=>{ acClose(); ROOT.removeEventListener('scroll',acScroll,true); });
  }
  if(f==='payee'){
    el.addEventListener('input',()=>{
      const guess=autoCatFor(el.value);
      if(guess && t.cat==='Uncategorized'){
        t.cat=guess;
        const catCell=td.closest('tr').querySelector('.cell[data-e="cat"]');
        if(catCell) catCell.textContent=guess;
      }
    });
  }
  td.innerHTML='';td.appendChild(el);el.focus({preventScroll:true});if(el.select)el.select();
  if(f==='cat') acRefresh(true);
  let pendingTab=0;
  const done=()=>{
    let v=el.value;
    if(f==='cat'){
      /* Free text has to land on a real category; anything else keeps the old one. */
      const hit=CATS.find(c=>c.toLowerCase()===String(v).trim().toLowerCase());
      v=hit||t.cat;
    }
    if(f==='payee'){
      v=String(v).trim();
      /* Repeat payee: fill its usual category, but only over the untouched
         default (or a guess this same edit made live), never over a pick. */
      const guess=v&&histCatFor(v,id);
      if(guess&&(t.cat==='Uncategorized'||t.cat===autoCatFor(v))) t.cat=guess;
    }
    if(f==='outflow'||f==='inflow'){
      const raw=String(v).trim();
      /* Only treat it as a formula if there's an operator that isn't just a
         leading minus sign - so a plain "-50" still behaves exactly like a
         plain negative number, not a broken expression. */
      const looksLikeFormula=/[+*/]/.test(raw) || /-/.test(raw.slice(1));
      const evaluated=looksLikeFormula?safeMathEval(raw):null;
      v=evaluated!==null ? Math.abs(evaluated) : (parseFloat(raw.replace(/[^0-9.\-]/g,''))||0);
      if(v)t[f==='outflow'?'inflow':'outflow']=0;
    }
    if(String(t[f])!==String(v)) t.edited=true;
    beforeChange(); t[f]=v; selId=id;
    /* A transfer's two legs must always net to zero. Correcting the amount
       on either one mirrors it onto the other (and marks that one edited
       too), rather than leaving the pair unbalanced or having Generate
       recreate the other leg later at the rule's stale template amount. */
    if((f==='outflow'||f==='inflow')&&t.xferId){
      const sib=S.txns.find(x=>x.xferId===t.xferId&&x.id!==t.id);
      if(sib){ const other=f==='outflow'?'inflow':'outflow'; sib[other]=v; sib[f]=0; sib.edited=true; }
    }
    save(); render(); if(f==='date') jump(id);
    if(pendingTab) requestAnimationFrame(()=>tabTo(id,f,pendingTab));
  };
  el.addEventListener('blur',done,{once:true});
  el.addEventListener('keydown',e=>{
    if(ac&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
      e.preventDefault();
      acIdx=(acIdx+(e.key==='ArrowDown'?1:-1)+acItems.length)%acItems.length; acDraw(); return;
    }
    if(ac&&e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); acClose(); return; }
    if(ac&&acIdx>=0&&(e.key==='Enter'||(e.key==='Tab'&&!e.shiftKey))) el.value=acItems[acIdx];
    if(e.key==='Enter'){e.preventDefault();el.blur();}
    else if(e.key==='Escape'){e.preventDefault();el.removeEventListener('blur',done);render();}
    else if(e.key==='Tab'){e.preventDefault();pendingTab=e.shiftKey?-1:1;el.blur();}
  });
}
/* Tab/Shift-Tab from an editing cell moves to the next (or previous)
   editable cell in the row, then wraps into the next/previous row - so Tab
   walks the register like a spreadsheet instead of falling out to whatever
   the browser's default focus order happens to be (checkboxes, buttons). */
function tabTo(id,f,dir){
  const tr=ROOT.querySelector(`tr[data-id="${id}"]`); if(!tr) return;
  const cells=[...tr.querySelectorAll('.cell')];
  const i=cells.findIndex(c=>c.dataset.e===f);
  const ni=i+dir;
  if(ni>=0 && ni<cells.length){
    const c=cells[ni];
    if(c.dataset.e==='date') edit(c.closest('td'),id,'date'); else edit(c.closest('td'),id,c.dataset.e);
    return;
  }
  const rowsEls=[...ROOT.querySelectorAll('#tb tr[data-id]')];
  const ri=rowsEls.findIndex(r=>r.dataset.id===id);
  const nri=ri+dir;
  if(nri<0||nri>=rowsEls.length) return;
  const ntr=rowsEls[nri];
  const ncells=[...ntr.querySelectorAll('.cell')];
  const nc=dir>0?ncells[0]:ncells[ncells.length-1];
  if(nc) edit(nc.closest('td'),ntr.dataset.id,nc.dataset.e);
}
const jump=id=>requestAnimationFrame(()=>{
  const tr=ROOT.querySelector(`tr[data-id="${id}"]`);
  if(tr)tr.scrollIntoView({block:'center',behavior:'smooth'});});

function drawCal(){

  const t=S.txns.find(x=>x.id===calFor);

    const d=new Date(vy,vm-2,prevDays-i); cells.push({d:iso(d),n:prevDays-i,off:true});}
  for(let i=1;i<=days;i++) cells.push({d:iso(new Date(vy,vm-1,i)),n:i,off:false});
  while(cells.length%7) {const i=cells.length-lead-days+1;

  if(left+box.width>window.innerWidth-6) left=Math.max(6,window.innerWidth-box.width-6);

/* ---- bank sync (replaces the old type-in-the-balance reconcile) ----
   "Reconcile" now means: pull real transactions from SimpleFIN, clear
   whatever already matches a ledger row, drop in whatever the bank has
   that the ledger doesn't (already cleared, tagged with sfTxnId so a
   re-sync never duplicates it), and leave anything that still doesn't
   line up sitting visible and uncleared instead of papering over it with
   a lump adjustment. Never touches a row dated after today - those are
   Generate's future projections, not real postings, and SimpleFIN only
   ever returns things that actually happened. */
function openReco(){ manualRecoOpen=false; xferOpen=false; acctOpen=false; recoOpen=true; render(); }
function closeReco(){ if(recoOpen){ recoOpen=false; render(); } }

function positionPanel(el,btn){
  const r=btn.getBoundingClientRect(), box=el.getBoundingClientRect();
  let top=r.bottom+4, left=r.left;
  if(top+box.height>window.innerHeight-6) top=Math.max(6,r.top-box.height-4);
  if(left+box.width>window.innerWidth-6) left=Math.max(6,window.innerWidth-box.width-6);
  el.style.top=top+'px'; el.style.left=left+'px';
}

async function drawReco(){
  const btn=$('#reco'); if(!btn){ recoOpen=false; return; }
  const startAcct=S.filter==='all'?S.accounts[0].id:S.filter;
  const acct=S.accounts.find(a=>a.id===startAcct);

  const el=document.createElement('div');
  el.className='reco';
  el.innerHTML=`<div class="rhead2">Sync with bank</div><div class="rc-diff">Talking to the bank&hellip;</div>`;
  ROOT.appendChild(el);
  positionPanel(el,btn);
  el.addEventListener('click',e=>e.stopPropagation());

  let data;
  try{
    const since=acct.reconciledThrough?Math.floor(parse(acct.reconciledThrough).getTime()/1000):0;
    const resp=await fetch(`/api/bank-sync?since=${since}`);
    data=await resp.json();
    if(!resp.ok) throw new Error(data.error||'sync failed');
  }catch(err){
    if(!recoOpen) return;
    el.innerHTML=`<div class="rhead2">Sync with bank</div>
      <div class="rc-diff">Couldn't reach the bank: ${esc(err.message)}</div>
      <div class="rc-btns"><button id="rc-cancel">Close</button></div>`;
    positionPanel(el,btn);
    el.querySelector('#rc-cancel').onclick=closeReco;
    return;
  }
  if(!recoOpen) return;   // closed while the fetch was in flight

  if(!acct.sfAcctId){
    /* Radio list, not a native <select> - clicking an option in the OS
       popup silently does nothing in some browsers on KDE/Wayland, which left this
       stuck on the first bank account. Pre-picks the bank account whose
       name shares the most words with the ledger account's. */
    const words=n=>new Set(n.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2).map(w=>w.replace(/s$/,'')));
    const mine=words(acct.name), taken=new Set(S.accounts.map(a=>a.sfAcctId).filter(Boolean));
    let guess=null, best=0;
    data.accounts.forEach(a=>{ if(taken.has(a.id)) return;
      const n=[...words(a.name)].filter(w=>mine.has(w)).length; if(n>best){ best=n; guess=a.id; } });
    el.innerHTML=`
      <div class="rhead2">Which bank account is "${esc(acct.name)}"?</div>
      <div class="sf-list">${data.accounts.map(a=>
        `<label class="sf-opt"><input type="radio" name="sf-pick" value="${esc(a.id)}"${a.id===guess?' checked':''}> ${esc(a.name)}</label>`).join('')}</div>
      <div class="rc-btns">
        <button id="rc-cancel">Cancel</button>
        <button id="rc-go" class="go">Link &amp; sync</button>
      </div>`;
    positionPanel(el,btn);
    el.querySelector('#rc-cancel').onclick=closeReco;
    el.querySelector('#rc-go').onclick=()=>{
      beforeChange();
      const pick=el.querySelector('input[name="sf-pick"]:checked');
      if(!pick) return;
      acct.sfAcctId=pick.value;
      save();
      runSync(acct,data,el,btn);
    };
    return;
  }
  runSync(acct,data,el,btn);
}

function runSync(acct,data,el,btn){
  const bankAcct=data.accounts.find(a=>a.id===acct.sfAcctId);
  if(!bankAcct){
    el.innerHTML=`<div class="rhead2">Sync with bank</div>
      <div class="rc-diff">That linked account didn't come back from the bank this time.</div>
      <div class="rc-btns">
        <button id="rc-relink" class="mini">Re-link</button>
        <button id="rc-cancel">Close</button>
      </div>`;
    positionPanel(el,btn);
    el.querySelector('#rc-cancel').onclick=closeReco;
    el.querySelector('#rc-relink').onclick=()=>{ beforeChange(); acct.sfAcctId=null; save(); drawReco(); };
    return;
  }

  beforeChange();
  const today=TODAY();
  const dateOf=posted=>iso(new Date(posted*1000));
  const alreadySynced=new Set(S.txns.filter(t=>t.acct===acct.id&&t.sfTxnId).map(t=>t.sfTxnId));
  const open=S.txns.filter(t=>t.acct===acct.id&&!t.cleared&&t.date<=today&&!t.sfTxnId);
  /* Rows already ticked by hand (or by Reconcile manually) but never tied to
     a bank transaction - second-choice matches, so a deposit you checked off
     yourself gets tagged instead of inserted again as a duplicate. */
  const handCleared=S.txns.filter(t=>t.acct===acct.id&&t.cleared&&t.date<=today&&!t.sfTxnId);
  const used=new Set();
  let matched=0, added=0;

  bankAcct.transactions.forEach(bt=>{
    if(alreadySynced.has(bt.id)) return;
    const amt=parseFloat(bt.amount)||0;
    const inflow=amt>0?amt:0, outflow=amt<0?-amt:0;
    const btDate=dateOf(bt.posted);

    let best=null, bestGap=Infinity;
    const look=row=>{
      if(used.has(row.id)) return;
      const sameAmt=Math.abs((+row.inflow||0)-inflow)<0.005&&Math.abs((+row.outflow||0)-outflow)<0.005;
      if(!sameAmt) return;
      const gap=Math.abs((parse(row.date)-parse(btDate))/864e5);
      if(gap<=3&&gap<bestGap){ best=row; bestGap=gap; }
    };
    open.forEach(look);
    if(!best) handCleared.forEach(look);

    if(best){
      best.cleared=true; best.sfTxnId=bt.id; best.edited=true;
      used.add(best.id); matched++;
    }else{
      S.txns.push({id:nid(),ord:seq++,date:btDate,acct:acct.id,
        payee:bt.payee||'Unknown',memo:bt.memo||'Synced from bank',
        cat:histCatFor(bt.payee||'',null,inflow>0?'in':'out')||'Uncategorized',
        outflow,inflow,cleared:true,edited:true,sfTxnId:bt.id});
      added++;
    }
  });

  const bankBal=parseFloat(bankAcct.balance)||0;
  const clearedBal=(+acct.opening||0)+S.txns.filter(t=>t.acct===acct.id&&t.cleared)
    .reduce((s,t)=>s+(+t.inflow||0)-(+t.outflow||0),0);
  const diff=Math.round((bankBal-clearedBal)*100)/100;
  const stillOpen=S.txns.filter(t=>t.acct===acct.id&&!t.cleared&&t.date<=today).length;
  if(stillOpen===0){
    acct.reconciledThrough=bankAcct.balanceDate?dateOf(bankAcct.balanceDate):today;
  }
  /* render() redraws the whole ROOT, which would otherwise re-trigger
     drawReco() (recoOpen is still true) and race a second "Talking to the
     bank..." fetch against the summary panel we're about to show below -
     the exact same "close before render" trick closeReco() already uses,
     just borrowed for a beat instead of a real close. */
  save();
  recoOpen=false; render(); recoOpen=true;

  const el2=document.createElement('div');
  el2.className='reco';
  el2.innerHTML=`<div class="rhead2">Synced</div>
    <div class="rc-diff${Math.abs(diff)<0.005?' ok':''}">
      ${matched} matched, ${added} new from the bank.<br>
      ${Math.abs(diff)<0.005
        ?'Matches the bank exactly.'
        :`Still off by ${money(Math.abs(diff))} (${diff>0?'bank shows more':'ledger shows more'}) &mdash; check for a pending charge, a fee, or a duplicate.`}
      ${stillOpen?`<br>${stillOpen} row${stillOpen===1?'':'s'} still unconfirmed, not tucked away &mdash; check the register.`:''}
    </div>
    <div class="rc-btns">
      ${Math.abs(diff)>=0.005?`<button id="rc-adj" class="mini" title="One lump balance-adjustment line for the remainder, the old way">Add adjustment</button>`:''}
      <button id="rc-cancel" class="go">Done</button>
    </div>`;
  ROOT.appendChild(el2);
  positionPanel(el2,btn);
  el2.addEventListener('click',e=>e.stopPropagation());
  el2.querySelector('#rc-cancel').onclick=closeReco;
  if(el2.querySelector('#rc-adj')) el2.querySelector('#rc-adj').onclick=()=>{
    beforeChange();
    S.txns.push({id:nid(),ord:seq++,date:today,acct:acct.id,payee:'Reconciliation',
      cat:'Uncategorized',memo:'Balance adjustment',
      outflow:diff<0?Math.abs(diff):0,inflow:diff>0?diff:0,cleared:true,edited:true});
    acct.reconciledThrough=today;
    save(); render(); closeReco();
  };
}

/* ---- manual reconcile (fallback for the once-a-day bank sync) ----
   For lots of small transactions you don't want to thumb into the
   phone one at a time as they happen: sync stays the daily
   default and this is the weekly catch-up: type in the bank's cleared
   balance, one lump adjustment line covers the gap. Pre-dates the
   SimpleFIN sync (this was the entire "Reconcile" flow before 2026-09-14)
   - restored 2026-09-16 as an explicit second option, not a replacement
   for sync. Own recoManual/manualRecoOpen state so it can't collide with
   the sync panel's #reco/recoOpen if both somehow get triggered. */
function openManualReco(){ recoOpen=false; xferOpen=false; acctOpen=false; manualRecoOpen=true; render(); }
function closeManualReco(){ if(manualRecoOpen){ manualRecoOpen=false; render(); } }
/* Record a one-off transfer between two of your own tracked accounts: pick
   From/To/amount/date, and both linked legs (cat Transfer, shared xferId)
   get created together in one action - no more manually adding one side and
   forgetting or mis-tagging the other (see [data-del] and edit() for how
   xferId is used to keep the pair deleted/balanced together afterward). Own
   xferOpen state, same reasoning as manualRecoOpen above. */
function openXfer(){ recoOpen=false; manualRecoOpen=false; acctOpen=false; xferOpen=true; render(); }
function closeXfer(){ if(xferOpen){ xferOpen=false; render(); } }

function drawXfer(){
  const btn=$('#xferBtn'); if(!btn){ xferOpen=false; return; }
  const startFrom=S.filter==='all'?S.accounts[0].id:S.filter;
  const other=S.accounts.find(a=>a.id!==startFrom);
  const startTo=other?other.id:startFrom;

  const el=document.createElement('div');
  el.className='reco';
  el.innerHTML=`
    <div class="rhead2">Record transfer</div>
    <label>From
      <select id="xf-from">${S.accounts.map(a=>
        `<option value="${a.id}"${a.id===startFrom?' selected':''}>${esc(a.name)}</option>`).join('')}</select>
    </label>
    <label>To
      <select id="xf-to">${S.accounts.map(a=>
        `<option value="${a.id}"${a.id===startTo?' selected':''}>${esc(a.name)}</option>`).join('')}</select>
    </label>
    <label>Amount <input class="num" id="xf-amt" placeholder="0.00"></label>
    <label>Date <input type="date" id="xf-date" value="${TODAY()}"></label>
    <label>Payee / note <input id="xf-note" list="payeeDL" placeholder="e.g. Rent share"></label>
    <div class="rc-diff" id="xf-warn"></div>
    <div class="rc-btns">
      <button id="xf-cancel">Cancel</button>
      <button id="xf-go" class="go">Record</button>
    </div>`;
  ROOT.appendChild(el);
  positionPanel(el,btn);
  el.addEventListener('click',e=>e.stopPropagation());

  const fromSel=el.querySelector('#xf-from'), toSel=el.querySelector('#xf-to'),
        amtInp=el.querySelector('#xf-amt'), warnEl=el.querySelector('#xf-warn'),
        goBtn=el.querySelector('#xf-go');
  const refresh=()=>{
    const same=fromSel.value===toSel.value;
    warnEl.textContent=same?'From and To must be different accounts.':'';
    warnEl.className='rc-diff'+(same?'':' ok');
    goBtn.disabled=same;
  };
  fromSel.onchange=refresh; toSel.onchange=refresh; refresh();

  el.querySelector('#xf-cancel').onclick=closeXfer;

    const from=fromSel.value, to=toSel.value;

    const payee=el.querySelector('#xf-note').value.trim();
    beforeChange();
    const xf=nid();
    S.txns.push(
      {id:nid(),ord:seq++,date,acct:from,payee,cat:'Transfer',memo:'',outflow:amt,inflow:0,cleared:false,xferId:xf},
      {id:nid(),ord:seq++,date,acct:to,payee,cat:'Transfer',memo:'',outflow:0,inflow:amt,cleared:false,xferId:xf}
    );
    xferOpen=false; save(); render();
  };
  amtInp.focus();
}

/* Start tracking another account. Additive only - no rename/delete here.
   New ids follow the existing a1/a2 scheme. Bank sync needs nothing extra:
   the first "Sync with bank" on the new account asks which bank account it
   is (see drawReco's sfAcctId picker). */
function openAcct(){ recoOpen=false; manualRecoOpen=false; xferOpen=false; acctOpen=true; render(); }
function closeAcct(){ if(acctOpen){ acctOpen=false; render(); } }
function drawAcct(){

  const el=document.createElement('div');
  el.className='reco';
  el.innerHTML=`
    <div class="rhead2">Add an account</div>
    <label>Name <input id="ac-name" placeholder="e.g. Savings"></label>
    <label>Starting balance <input class="num" id="ac-open" placeholder="0.00"></label>
    <div class="rc-diff ok" id="ac-warn">Leave the starting balance at 0 for a brand-new account &mdash; record the first deposit as a transfer instead.</div>
    <div class="rc-btns">
      <button id="ac-cancel">Cancel</button>
      <button id="ac-go" class="go">Add account</button>
    </div>`;
  ROOT.appendChild(el);
  positionPanel(el,btn);
  el.addEventListener('click',e=>e.stopPropagation());
  const nameInp=el.querySelector('#ac-name'), warnEl=el.querySelector('#ac-warn');
  el.querySelector('#ac-cancel').onclick=closeAcct;
  const hint=warnEl.innerHTML;
  nameInp.oninput=()=>{ warnEl.innerHTML=hint; warnEl.className='rc-diff ok'; };
  const go=()=>{
    const name=nameInp.value.trim();
    if(!name){ nameInp.focus(); return; }
    if(S.accounts.some(a=>a.name.trim().toLowerCase()===name.toLowerCase())){
      warnEl.textContent='You already have an account called that.'; warnEl.className='rc-diff'; nameInp.focus(); return;
    }
    const opening=parseFloat(el.querySelector('#ac-open').value)||0;
    const n=S.accounts.reduce((m,a)=>{const k=/^a(\d+)$/.exec(a.id); return k?Math.max(m,+k[1]):m;},0)+1;
    beforeChange();
    const id='a'+n;
    S.accounts.push({id,name,opening,reconciledThrough:null});
    S.filter=id;
    acctOpen=false; save(); render();
  };
  el.querySelector('#ac-go').onclick=go;
  el.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter') go(); });
  nameInp.focus();
}

function drawManualReco(){
  const btn=$('#recoManual'); if(!btn){ manualRecoOpen=false; return; }
  const all=computed();
  const acctFor=id=>{
    const rows=all.filter(r=>r.acct===id);
    const ob=+((S.accounts.find(a=>a.id===id)||{}).opening)||0;
    return ob+rows.filter(r=>r.cleared).reduce((s,r)=>s+(+r.inflow||0)-(+r.outflow||0),0);
  };
  const startAcct=S.filter==='all'?S.accounts[0].id:S.filter;

  const el=document.createElement('div');
  el.className='reco';
  el.innerHTML=`
    <div class="rhead2">Reconcile manually</div>
    <label>Account
      <select id="mrc-acct">${S.accounts.map(a=>
        `<option value="${a.id}"${a.id===startAcct?' selected':''}>${esc(a.name)}</option>`).join('')}</select>
    </label>
    <label>Reconciled through <input type="date" id="mrc-date" value="${TODAY()}"
      title="Everything on or before this date gets tucked away. Leave as today unless you mean otherwise."></label>
    <label>Bank's cleared balance
      <input class="num" id="mrc-amt" value="${acctFor(startAcct).toFixed(2)}"></label>
    <div class="rc-diff" id="mrc-diff"></div>
    <div class="rc-btns">
      <button id="mrc-cancel">Cancel</button>
      <button id="mrc-go" class="go">Adjust</button>
    </div>`;
  ROOT.appendChild(el);
  positionPanel(el,btn);
  el.addEventListener('click',e=>e.stopPropagation());

  const acctSel=el.querySelector('#mrc-acct'), amtInp=el.querySelector('#mrc-amt'),
        diffEl=el.querySelector('#mrc-diff');
  const refresh=()=>{
    const entered=parseFloat(amtInp.value)||0;
    const cur=acctFor(acctSel.value);
    const diff=Math.round((entered-cur)*100)/100;
    if(Math.abs(diff)<0.005){ diffEl.textContent='Already matches, no adjustment needed.'; diffEl.className='rc-diff ok'; }
    else{
      diffEl.textContent=(diff>0?'Adds an inflow of ':'Adds an outflow of ')+money(Math.abs(diff))+' to line up with the bank.';
      diffEl.className='rc-diff';
    }
  };
  acctSel.onchange=()=>{ amtInp.value=acctFor(acctSel.value).toFixed(2); refresh(); };
  amtInp.oninput=refresh;
  refresh();

  el.querySelector('#mrc-cancel').onclick=closeManualReco;
  el.querySelector('#mrc-go').onclick=()=>{
    const id=acctSel.value;
    const entered=parseFloat(amtInp.value)||0;
    const diff=Math.round((entered-acctFor(id))*100)/100;
    const rdate=el.querySelector('#mrc-date').value||TODAY();
    beforeChange();
    if(Math.abs(diff)>=0.005){
      S.txns.push({id:nid(),ord:seq++,date:rdate,
        acct:id,payee:'Reconciliation',cat:'Uncategorized',memo:'Balance adjustment',
        outflow:diff<0?Math.abs(diff):0,inflow:diff>0?diff:0,cleared:true,edited:true});
    }
    S.txns.forEach(t=>{ if(t.acct===id && t.date<=rdate){ t.cleared=true; t.edited=true; } });
    const acct=S.accounts.find(a=>a.id===id);
    if(acct) acct.reconciledThrough=rdate;
    manualRecoOpen=false; save(); render();
  };
  amtInp.focus(); amtInp.select();
}

/* Table/footer listeners only. Never touches the drawer, so editing a
   recurring rule can't cause the (potentially long) register to flash. */
function wireTable(){
  ROOT.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();render();});
  $('#fs').oninput=e=>{S.fs=+e.target.value;save();render();};
  $('#payeeQ').oninput=e=>{payeeQ=e.target.value;render();};
  $('#payeeQ').onkeydown=e=>{ if(e.key==='Escape'&&payeeQ){ e.stopPropagation(); payeeQ=''; render(); } };
  if($('#payeeQx')) $('#payeeQx').onclick=()=>{payeeQ='';render();$('#payeeQ').focus();};
  $('#add').onclick=()=>{
    beforeChange();
    const id=nid();
    const acctId=S.filter==='all'?S.accounts[0].id:S.filter;
    S.txns.push({id,ord:seq++,date:TODAY(),acct:acctId,
      payee:'',cat:'Uncategorized',memo:'',outflow:0,inflow:0,cleared:false});
    selId=id;save();render();jump(id);
    requestAnimationFrame(()=>{
      const c=ROOT.querySelector(`tr[data-id="${id}"] .cell[data-e="payee"]`);
      if(c) edit(c.closest('td'),id,'payee');
    });
  };
  $('#rules').onclick=()=>{S.showRules=!S.showRules; if(S.showRules){S.showChart=false;S.showBudget=false;} drawerAnim=true;save();render();};
  $('#chartBtn').onclick=()=>{S.showChart=!S.showChart; if(S.showChart){S.showRules=false;S.showBudget=false;} drawerAnim=true;save();render();};
  $('#budgetBtn').onclick=()=>{S.showBudget=!S.showBudget; if(S.showBudget){S.showRules=false;S.showChart=false;} drawerAnim=true;save();render();};
  if($('#catQx')) $('#catQx').onclick=()=>{catQ=null;render();};
  $('#exp').onclick=exp; $('#imp').onclick=imp;
  $('#darkbtn').onclick=()=>{S.dark=!S.dark;save();render();};
  $('#reco').onclick=e=>{e.stopPropagation(); recoOpen?closeReco():openReco();};
  $('#recoManual').onclick=e=>{e.stopPropagation(); manualRecoOpen?closeManualReco():openManualReco();};
  $('#xferBtn').onclick=e=>{e.stopPropagation(); xferOpen?closeXfer():openXfer();};
  $('#acctBtn').onclick=e=>{e.stopPropagation(); acctOpen?closeAcct():openAcct();};
  $('#undoBtn').onclick=undo;
  if($('#toggleReconciled')) $('#toggleReconciled').onclick=()=>{
    S.showReconciled=!S.showReconciled; save(); render();
  };
  if($('#clearLock')) $('#clearLock').onclick=()=>{
    const acct=S.filter==='all'?null:S.accounts.find(a=>a.id===S.filter);
    if(!acct) return;
    beforeChange();
    acct.reconciledThrough=null;
    S.showReconciled=false;
    save(); render();
  };

  ROOT.querySelectorAll('#tb .cell').forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    const id=c.closest('tr').dataset.id;
    if(c.dataset.e==='date') openCal(id);
    else { if(calFor){calFor=null;calView=null;} edit(c.closest('td'),id,c.dataset.e); }
  });
  ROOT.querySelectorAll('#tb [data-clr]').forEach(c=>{
    c.onclick=e=>e.stopPropagation();
    c.onchange=()=>{
      const t=S.txns.find(x=>x.id===c.closest('tr').dataset.id);
      beforeChange(); t.cleared=c.checked;t.edited=true;save();render();};
  });
  ROOT.querySelectorAll('#tb [data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();beforeChange();
    const delId=b.closest('tr').dataset.id;
    const delT=S.txns.find(x=>x.id===delId);
    /* A transfer's two legs are one instance - deleting either one deletes
       both, so you can never end up with an unbalanced half-transfer sitting
       in one account with no trace in the other. */
    const ids=[delId];
    if(delT&&delT.xferId){
      const sib=S.txns.find(x=>x.xferId===delT.xferId&&x.id!==delId);
      if(sib) ids.push(sib.id);
    }
    /* Deleting a generated row is a deliberate "never make this one again" -
       record its cycle so a future Generate can't resurrect it. Without this
       the row just vanishes from the array with no memory it ever existed,
       and the next Generate recreates it since it only skips cycles that
       still have a surviving (kept) row. */
    if(delT&&delT.ruleId){
      const cyc=delT.cycle||delT.date;
      const list=(S.skips[delT.ruleId]=S.skips[delT.ruleId]||[]);
      if(!list.includes(cyc)) list.push(cyc);
    }
    S.txns=S.txns.filter(x=>!ids.includes(x.id));save();render();});
  ROOT.querySelectorAll('#tb tr[data-id]').forEach(tr=>tr.onclick=()=>{selId=tr.dataset.id;render();});
}

/* Rule edits, chart controls: none of these change a single row in the
   register, so they only ever repaint the drawer, never the (potentially
   long) table underneath. Account name/opening/Generate/Erase touch real
   balances, so those still go through the full render(). */
function renderDrawer(){
  const dr=$('#drawer'); if(!dr) return;
  const scrollTop=dr.scrollTop;
  dr.innerHTML=drawerHTML();
  dr.scrollTop=scrollTop;
  lastProgDrawerScroll=dr.scrollTop;
  if(S.showRules||S.showChart||S.showBudget)
    dr.style.maxHeight=Math.min(dr.scrollHeight,Math.round(window.innerHeight*drawerFrac()))+'px';
  wireDrawer();
}
/* A rule's onchange fires while the field is still mid-blur; replacing the
   drawer's innerHTML synchronously in that handler can remove a node the
   browser is still dispatching the event through (e.g. typing, then
   immediately clicking "+ Add a recurring item"). Deferring one frame lets
   the current event finish first. */
let panelPending=false;
function deferPanel(){
  if(panelPending) return;
  panelPending=true;
  requestAnimationFrame(()=>{panelPending=false;renderDrawer();});
}
function wireDrawer(){
  if(S.showBudget) wireBudgetPanel(); else if(S.showChart) wireChartPanel(); else wirePanel();
}
/* The budget grid is tall, so its drawer gets more of the window. */
const drawerHTML=()=>S.showBudget?budgetPanel():S.showChart?chartPanel():panel();
const drawerFrac=()=>S.showBudget?0.7:0.42;
function wirePanel(){
  ROOT.querySelectorAll('[data-rid]').forEach(box=>{
    const r=S.rules.find(x=>x.id===box.dataset.rid);
    box.querySelectorAll('[data-rf]').forEach(f=>f.onchange=()=>{
      const k=f.dataset.rf;
      beforeChange();
      r[k]=(k==='amt'||k==='day'||k==='wd')?(parseFloat(f.value)||0):f.value;
      // picking a To account turns this into a transfer: lock the semantics
      // (always Transfer, always out of Account into To account) so the
      // stored rule can't disagree with what the disabled cat/dir controls show
      if(k==='toAcct'&&r.toAcct){ r.cat='Transfer'; r.dir='out'; }
      // changing From out from under a chosen To account would let them match
      if(k==='acct'&&r.toAcct===r.acct) r.toAcct='';
      save();
      /* 'freq' changes which sub-fields are even shown (day input vs weekday
         picker vs biweekly anchor); 'acct'/'toAcct' change whether this row
         is a transfer, which locks/unlocks the cat and dir controls and
         changes the To-account option list - all three need a rebuild.
         Rebuilding on every field steals focus mid-Tab, since the input you
         just tabbed out of gets destroyed before the browser finishes moving
         focus to the next one, so everything else stays untouched here. */
      if(k==='freq'||k==='acct'||k==='toAcct') deferPanel();
    });
    box.querySelector('[data-radd]').onclick=()=>{
      beforeChange();
      const res=addNext(r.id);
      genMsg = res.added
        ? `Added "${r.payee||'this bill'}" for ${fmtD(res.date)}. Click Add next again for the one after that.`
        : `Nothing new for "${r.payee||'this bill'}" - already accounted for, or nothing left before the fill-through date.`;
      render();
    };
    box.querySelector('[data-rgen]').onclick=()=>{
      beforeChange();
      const res=regenOne(r.id);
      genMsg = res.added===0
        ? `Nothing new for "${r.payee||'this bill'}" - already accounted for. Nothing else was touched.`
        : `Added ${res.added} new row${res.added===1?'':'s'} for "${r.payee||'this bill'}" only. Nothing else on the ledger was touched.`;
      render();
    };
    box.querySelector('[data-rdel]').onclick=()=>{
      beforeChange(); S.rules=S.rules.filter(x=>x.id!==r.id);save();deferPanel();};
  });
  $('#radd').onclick=()=>{beforeChange(); S.rules.push(blankRule());save();deferPanel();};
  $('#go').onclick=()=>{
    beforeChange();
    const r=regen();
    genMsg = r.added===0
      ? `Nothing new - all ${r.kept} of your rows were already accounted for.`
      : `Added ${r.added} new row${r.added===1?'':'s'}. ${r.kept} of your existing rows (edited, moved, or cleared) were left exactly as you had them.`;
    render();
  };
  $('#hz').onchange=e=>{beforeChange(); S.horizon=e.target.value;save();deferPanel();};
  $('#wipe').onclick=()=>{
    if(confirm('Erase every transaction, recurring item and balance, and start over? This cannot be undone.')){
      beforeChange(); S=fresh();save();render();}
  };
  ROOT.querySelectorAll('[data-an]').forEach(i=>i.onchange=()=>{
    beforeChange(); S.accounts.find(a=>a.id===i.dataset.an).name=i.value;save();render();});
  ROOT.querySelectorAll('[data-ao]').forEach(i=>i.onchange=()=>{
    beforeChange(); S.accounts.find(a=>a.id===i.dataset.ao).opening=parseFloat(i.value)||0;save();render();});
}

function dl(n,t,ty){const b=new Blob([t],{type:ty}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
function exp(){
  const rows=computed();
  const csv=['Date,Account,Payee,Category,Memo,Outflow,Inflow,Balance,Cleared']
   .concat(rows.map(r=>[fmtD(r.date),acctNm(r.acct),r.payee,r.cat,r.memo,r.outflow||'',
     r.inflow||'',r.balance.toFixed(2),r.cleared?'C':'']
     .map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(','))).join('\n');
  dl('register.csv',csv,'text/csv');
  dl('register-backup.json',JSON.stringify(S,null,2),'application/json');
}
function imp(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(rd.result));
      seq=S.txns.reduce((m,x)=>Math.max(m,x.ord||0),0)+1;save();render();}
      catch(e){alert('That is not a register backup file.');}};
    rd.readAsText(f);};
  i.click();
}
let t; const save=()=>{clearTimeout(t);t=setTimeout(()=>store.set(S),250);};

document.addEventListener('click',()=>{closeCal();closeReco();closeManualReco();closeXfer();closeAcct();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeCal();closeReco();closeManualReco();closeXfer();closeAcct();}
  const inField=document.activeElement&&
    ['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!inField){ e.preventDefault(); undo(); }
});
ROOT.addEventListener('scroll',e=>{
  const el=e.target;
  if(el&&el.classList&&el.classList.contains('wrap')&&el.scrollTop===lastProgWrapScroll) return;
  if(el&&el.id==='drawer'&&el.scrollTop===lastProgDrawerScroll) return;
  closeCal();closeReco();closeManualReco();closeXfer();closeAcct();
},true);

(async()=>{
  await store.test();
  const v=await store.get();
  if(v&&v.accounts){S=Object.assign(fresh(),v);seq=S.txns.reduce((m,x)=>Math.max(m,x.ord||0),0)+1;}
  mergeBudgetCats();
  /* horizon isn't rolling on its own - it's a saved date, frozen at whenever
     it was last set. Re-sync it forward to "today+1yr" on every load so it
     never falls behind; a horizon manually pushed further out than that is
     left alone. */
  if(parse(S.horizon)<parse(yearOut)){ S.horizon=yearOut; save(); }
  render();
})();
})();
</script>
